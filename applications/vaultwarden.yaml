apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vaultwarden
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://charts.pascaliske.dev
      chart: vaultwarden
      targetRevision: 2.0.0
      helm:
        valueFiles:
          - $values/values/vaultwarden-values.yaml
    - repoURL: https://github.com/FurryJulie/infra-argocd.git
      targetRevision: dev
      path: vaultwarden
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
  destination:
    server: https://kubernetes.default.svc
    namespace: vaultwarden
